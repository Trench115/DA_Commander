<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruleta - Airsoft Control</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app roulette-screen">

    <a href="index.html" class="back-link">&larr; Menú</a>

    <div class="roulette-stage">
      <div class="roulette-pointer" aria-hidden="true"></div>
      <div class="roulette-wheel" id="rouletteWheel" aria-live="polite"></div>
    </div>

    <div class="roulette-controls">
      <button class="roulette-spin" id="spinBtn" type="button">Girar</button>
    </div>

    <div class="roulette-result" id="rouletteResult">Pulsa girar para empezar</div>

  </div>

<script src="common.js"></script>
<script src="ruleta.js"></script>
</body>
</html>
