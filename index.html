<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Airsoft Control</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="menu">
    <h1 class="menu-title">DISTRITO AIRSOFT</h1>

    <div class="scoreboard-panel" aria-label="Marcador del menú">
      <div class="score-team score-red">
        <span class="score-label">Equipo rojo</span>
        <div class="score-row">
          <button class="score-btn score-minus" type="button" data-team="red" data-delta="-1">-</button>
          <span class="score-value" id="menuScoreRed">0</span>
          <button class="score-btn score-plus" type="button" data-team="red" data-delta="1">+</button>
        </div>
      </div>

      <div class="score-team score-blue">
        <span class="score-label">Equipo azul</span>
        <div class="score-row">
          <button class="score-btn score-minus" type="button" data-team="blue" data-delta="-1">-</button>
          <span class="score-value" id="menuScoreBlue">0</span>
          <button class="score-btn score-plus" type="button" data-team="blue" data-delta="1">+</button>
        </div>
      </div>

      <button class="score-reset" type="button" id="menuResetScores">Reiniciar marcador</button>
    </div>

    <div class="menu-timer-panel" aria-label="Cronómetro del menú">
      <div class="menu-timer-label">Cronómetro</div>
      <div class="menu-timer-display" id="menuTimerDisplay">15:00</div>

      <div class="menu-timer-controls">
        <button type="button" class="menu-timer-btn" id="menuTimerMinus">-1 min</button>
        <button type="button" class="menu-timer-btn" id="menuTimerPlus">+1 min</button>
      </div>

      <button type="button" class="menu-timer-start" id="menuTimerToggle">Iniciar</button>
    </div>

    <a href="posesion.html" class="mode-card">
      <span class="mode-name">Punto caliente</span>
    </a>

    <a href="captura.html" class="mode-card">
      <span class="mode-name">Captura la Bandera</span>
    </a>

    <a href="temporizadores.html" class="mode-card">
      <span class="mode-name">Temporizadores</span>
    </a>

    <!-- Aquí iremos añadiendo más modos de juego en el futuro -->

  </div>

<script src="common.js"></script>
<script>
  const menuScoreRedEl = document.getElementById('menuScoreRed');
  const menuScoreBlueEl = document.getElementById('menuScoreBlue');
  const menuResetScoresBtn = document.getElementById('menuResetScores');
  const menuTimerDisplay = document.getElementById('menuTimerDisplay');
  const menuTimerToggleBtn = document.getElementById('menuTimerToggle');
  const menuTimerMinusBtn = document.getElementById('menuTimerMinus');
  const menuTimerPlusBtn = document.getElementById('menuTimerPlus');

  let menuTimerMs = 15 * 60 * 1000;
  let menuTimerRunning = false;
  let menuTimerStarted = false;
  let menuTimerLastTick = Date.now();
  let menuTimerLoopId = null;

  function renderMenuScores() {
    const scores = getTeamWins();
    menuScoreRedEl.textContent = String(scores.red);
    menuScoreBlueEl.textContent = String(scores.blue);
  }

  function renderMenuTimer() {
    menuTimerDisplay.textContent = formatTime(menuTimerMs);
    menuTimerToggleBtn.textContent = menuTimerRunning ? 'Pausar' : (menuTimerStarted ? 'Reanudar' : 'Iniciar');
    menuTimerToggleBtn.classList.toggle('running', menuTimerRunning);
  }

  function stopMenuTimerLoop() {
    if (menuTimerLoopId) {
      clearInterval(menuTimerLoopId);
      menuTimerLoopId = null;
    }
  }

  function tickMenuTimer() {
    const now = Date.now();
    const delta = now - menuTimerLastTick;
    menuTimerLastTick = now;

    if (!menuTimerRunning) return;

    menuTimerMs = Math.max(0, menuTimerMs - delta);
    renderMenuTimer();

    if (menuTimerMs === 0) {
      menuTimerRunning = false;
      stopMenuTimerLoop();
      beep();
      beep();
      beep();
      renderMenuTimer();
    }
  }

  function startMenuTimerLoop() {
    if (menuTimerLoopId) return;
    menuTimerLastTick = Date.now();
    menuTimerLoopId = setInterval(tickMenuTimer, 200);
  }

  function toggleMenuTimer() {
    if (!menuTimerStarted) {
      menuTimerStarted = true;
      primeAudio();
    }

    menuTimerRunning = !menuTimerRunning;
    if (menuTimerRunning) {
      startMenuTimerLoop();
    } else {
      stopMenuTimerLoop();
    }

    renderMenuTimer();
  }

  menuTimerMinusBtn.addEventListener('click', () => {
    if (menuTimerRunning) return;
    menuTimerMs = Math.max(0, menuTimerMs - 60 * 1000);
    menuTimerDisplay.textContent = formatTime(menuTimerMs);
  });

  menuTimerPlusBtn.addEventListener('click', () => {
    if (menuTimerRunning) return;
    menuTimerMs += 60 * 1000;
    menuTimerDisplay.textContent = formatTime(menuTimerMs);
  });

  menuTimerToggleBtn.addEventListener('click', toggleMenuTimer);

  document.querySelectorAll('.score-btn').forEach((button) => {
    button.addEventListener('click', () => {
      const team = button.dataset.team;
      const delta = Number(button.dataset.delta || 0);
      changeTeamWins(team, delta);
      renderMenuScores();
    });
  });

  menuResetScoresBtn.addEventListener('click', () => {
    resetTeamWins();
    renderMenuScores();
  });

  renderMenuScores();
  renderMenuTimer();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
